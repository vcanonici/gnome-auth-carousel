name: Verificacoes
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Compilar o Shell e rodar o e2e em container (lento)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  code:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get install -y gettext
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 -m compileall -q scripts tests
      - run: bash -n scripts/build.sh scripts/container_build.sh scripts/container/*.sh
      - run: cmp state.js scripts/state.js
      - run: for po in po/*.po; do msgfmt --check -o /dev/null "$po"; done
  container:
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/container_build.sh --no-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-build
          path: |
            artifacts/container/*.log
            artifacts/container/SHA256SUMS
